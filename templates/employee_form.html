
{% extends 'base.html' %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h3>{{ title }}</h3>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-success">
                Save Employee
            </button>

            <a href="{% url 'employee_list' %}"
               class="btn btn-secondary">Cancel</a>
        </form>

    </div>
</div>

{% endblock %}
